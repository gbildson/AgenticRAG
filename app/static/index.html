<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agentic RAG</title>
  <style>
    :root {
      color-scheme: light dark;
      font-family: Inter, ui-sans-serif, system-ui, sans-serif;
      --accent: #2563eb;
      --surface: color-mix(in srgb, Canvas 94%, CanvasText 6%);
      --border: color-mix(in srgb, CanvasText 18%, transparent);
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: Canvas; color: CanvasText; }
    main { width: min(920px, 92vw); margin: 3rem auto; }
    header { margin-bottom: 2rem; }
    h1 { margin: 0 0 .4rem; font-size: clamp(1.8rem, 4vw, 2.7rem); }
    header p { margin: 0; opacity: .72; }
    form { display: flex; gap: .7rem; margin-bottom: 1.5rem; }
    textarea {
      flex: 1; min-height: 72px; resize: vertical; padding: .9rem;
      border: 1px solid var(--border); border-radius: 10px;
      background: var(--surface); color: inherit; font: inherit;
    }
    button {
      align-self: stretch; border: 0; border-radius: 10px; padding: 0 1.3rem;
      background: var(--accent); color: white; font-weight: 700; cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    article {
      border: 1px solid var(--border); border-radius: 12px;
      padding: 1.1rem 1.25rem; margin: 1rem 0; background: var(--surface);
    }
    .question { border-left: 4px solid var(--accent); }
    .answer { white-space: pre-wrap; line-height: 1.55; }
    details { margin-top: 1rem; }
    summary { cursor: pointer; font-weight: 650; }
    .source { margin: .8rem 0; padding-top: .8rem; border-top: 1px solid var(--border); }
    .source p { margin: .35rem 0; line-height: 1.4; }
    code { white-space: pre-wrap; word-break: break-word; }
    .muted { opacity: .68; font-size: .9rem; }
    #status { min-height: 1.3rem; margin-bottom: .5rem; }
  </style>
</head>
<body>
<main>
  <header>
    <h1>Agentic RAG</h1>
    <p>Ask questions about the configured documents and structured data.</p>
  </header>
  <form id="chat-form">
    <textarea id="question" required maxlength="4000"
      placeholder="Ask a question about the available evidence…"></textarea>
    <button id="submit" type="submit">Ask</button>
  </form>
  <div id="status" class="muted" aria-live="polite"></div>
  <section id="conversation" aria-live="polite"></section>
</main>
<script>
  const form = document.querySelector("#chat-form");
  const input = document.querySelector("#question");
  const submit = document.querySelector("#submit");
  const status = document.querySelector("#status");
  const conversation = document.querySelector("#conversation");

  function element(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined) node.textContent = text;
    return node;
  }

  function renderEvidence(parent, evidence, trace) {
    const details = element("details");
    details.append(element("summary", "", `Evidence (${evidence.length})`));
    for (const item of evidence) {
      const source = element("div", "source");
      if (item.source_type === "document") {
        const location = [item.source, item.page ? `p. ${item.page}` : null, item.section].filter(Boolean).join(" · ");
        source.append(element("strong", "", location));
        source.append(element("p", "", item.excerpt));
      } else if (item.source_type === "sql") {
        source.append(element("strong", "", "Structured data"));
        source.append(element("p", "muted", item.sql));
        source.append(element("code", "", JSON.stringify(item.rows, null, 2)));
      }
      details.append(source);
    }
    if (trace.length) {
      details.append(element("p", "muted",
        `Tools: ${trace.map(step => step.tool).join(" → ")}`));
    }
    parent.append(details);
  }

  form.addEventListener("submit", async (event) => {
    event.preventDefault();
    const question = input.value.trim();
    if (!question) return;
    conversation.prepend(element("article", "question", question));
    submit.disabled = true;
    status.textContent = "Gathering evidence and reasoning…";
    try {
      const response = await fetch("/api/chat", {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({question})
      });
      const data = await response.json();
      if (!response.ok) throw new Error(data.detail || "Request failed");
      const article = element("article");
      article.append(element("div", "answer", data.answer));
      renderEvidence(article, data.evidence || [], data.trace || []);
      conversation.prepend(article);
      input.value = "";
      status.textContent = "";
    } catch (error) {
      status.textContent = `Error: ${error.message}`;
    } finally {
      submit.disabled = false;
      input.focus();
    }
  });
</script>
</body>
</html>
